name: Build and test

# The security work of 2026-08-23 and 2026-08-24 was written, reviewed and pushed
# without ever being compiled: there was no continuous integration and no
# development machine able to build the solution. One change in that batch
# (SecureSocketOptions.Auto in MailUtil) put SMTP onto a code path with a known
# advisory, and nothing caught it until Dependabot happened to rescan on push.
#
# This workflow exists so that does not happen again.

# develop is listed alongside dev: pushing dev produced a GitHub notice saying
# the branch had been renamed to develop, so a rename rule may be in force on
# this repository. Covering both names means the pipeline runs whichever one the
# branch ends up under.
#
# The ignored paths are the ones nothing in this workflow reads: documentation,
# licences, and the two projects (SSIS, installer) that no hosted runner can
# build. A change confined to them gets no run and no check.
on:
  push:
    branches: [main, dev, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'Oasis_IS/**'
      - 'OasisSetup/**'
  pull_request:
    branches: [main, dev, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'Oasis_IS/**'
      - 'OasisSetup/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the running build
# obsolete, so it is cancelled. main is the exception: every commit that lands
# there keeps its own complete result, since nothing deploys from it yet and
# the run history is the audit trail.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  # Everything except the Telerik desktop client. Oasis_Common no longer
  # references Telerik, so this job needs nothing commercial and runs on a stock
  # runner. It covers the whole server side and the entire test suite, which is
  # where the security-sensitive code lives.
  build:
    name: Server, library and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v4

      # packages/ is gitignored, so nothing builds before the restore. Every
      # packages.config pins exact versions, so their combined hash names the
      # exact package set and the folder can be kept between runs. A partial
      # match (restore-keys) hands over the previous set and the restore below
      # fetches only what changed.
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: packages
          key: nuget-${{ runner.os }}-${{ hashFiles('*/packages.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Restoring the solution also covers the SSIS and installer projects,
      # which NuGet skips with a warning rather than an error. With the cache
      # warm this only verifies what is already on disk.
      - name: Restore packages
        run: nuget restore Oasis_WF.sln -NonInteractive

      # One MSBuild call for the whole Telerik-free graph. ci.proj lists the
      # three leaf projects; their references bring in Oasis_Common and
      # Oasis_Web, built once and shared. /m lets independent projects build
      # side by side.
      - name: Build server, library, tools and tests
        run: msbuild .github\ci.proj /m /p:Configuration=Release /p:Platform=AnyCPU /nologo /v:minimal

      # setup-msbuild puts msbuild on PATH but not vstest. vswhere is the
      # supported way to find the test platform on a runner image.
      - name: Locate vstest.console
        id: vstest
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.PackageGroup.TestTools.Core -property installationPath
          if (-not $vs) { throw "No Visual Studio installation with the test tools was found on this runner." }
          $exe = Join-Path $vs "Common7\IDE\Extensions\TestPlatform\vstest.console.exe"
          if (-not (Test-Path $exe)) { throw "vstest.console.exe not found under $vs" }
          "path=$exe" >> $env:GITHUB_OUTPUT

      # The suite covers password hashing, prescription signature round-trips,
      # the delegated signing hook and document name validation. A failure here
      # means a security control has stopped working, not merely a broken test.
      - name: Run tests
        run: '& "${{ steps.vstest.outputs.path }}" UnitTest\bin\Release\UnitTest.dll /logger:trx /ResultsDirectory:TestResults'
        shell: pwsh

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  # The desktop client needs Telerik UI for WinForms, which is commercial and
  # deliberately absent from this repository. The job runs only where the
  # licensed assemblies can be provided, and is skipped, not failed, elsewhere:
  # a fork or an outside contributor should still get a green build for
  # everything above.
  #
  # The assemblies come from Telerik's own NuGet feed, so nothing commercial is
  # ever re-hosted. Set one repository variable and two repository secrets:
  #
  #   TELERIK_CI               variable, the literal true. Secrets cannot be
  #                            read in a job condition, so this is what lets
  #                            the job be skipped before a runner is even
  #                            started. Without it a Windows runner used to be
  #                            billed on every push just to find no secret.
  #   TELERIK_NUGET_USERNAME   your Telerik account e-mail, or the literal
  #                            api-key when using a generated key
  #   TELERIK_NUGET_PASSWORD   the account password, or the key itself
  #
  # Generate a key at account.telerik.com under Downloads, NuGet feed. See the
  # README section "Telerik setup".
  #
  # The package is restored into a scratch folder rather than added to
  # packages.config, and TELERIK_WINFORMS_DIR then points the build at it. That
  # keeps Directory.Build.props and the HintPaths in Oasis_WF.vbproj as they
  # are, so a developer with a Control Panel install is unaffected. The lib
  # folder of the package is not a complete Bin40 and lacks the design-time
  # assemblies, which is why OASIS003 may be warned here. That only affects the
  # Visual Studio designer and is irrelevant on a runner.
  #
  # The Telerik folder is deliberately not cached. This repository is public,
  # and a pull request from a fork can read caches made on the base branch,
  # which would hand the licensed assemblies to anyone who opens one.
  #
  # A self-hosted runner with Telerik installed works too: Directory.Build.props
  # already picks up the Control Panel default location.
  desktop:
    name: Desktop client (needs Telerik)
    runs-on: windows-latest
    timeout-minutes: 30
    if: ${{ vars.TELERIK_CI == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

    env:
      # Matches the 2022.2.622.40 assemblies the project references. The Trial
      # suffix is dropped from the package id for a licensed account:
      # Telerik.UI.for.WinForms.AllControls.
      TELERIK_PACKAGE_ID: Telerik.UI.for.WinForms.AllControls.Trial
      TELERIK_PACKAGE_VERSION: 2022.2.622

    steps:
      - uses: actions/checkout@v5

      # TELERIK_CI says the secrets exist. If they do not, that is a
      # misconfiguration worth a red build, not a silent skip.
      - name: Check that the Telerik credentials are set
        shell: pwsh
        env:
          TELERIK_NUGET_USERNAME: ${{ secrets.TELERIK_NUGET_USERNAME }}
          TELERIK_NUGET_PASSWORD: ${{ secrets.TELERIK_NUGET_PASSWORD }}
        run: |
          if (-not $env:TELERIK_NUGET_USERNAME -or -not $env:TELERIK_NUGET_PASSWORD) {
            throw "The TELERIK_CI variable is true but TELERIK_NUGET_USERNAME or TELERIK_NUGET_PASSWORD is not set."
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v4

      # The credentials are stored in clear text because the encrypted store is
      # per-user and per-machine, and an ephemeral runner is neither. The file
      # dies with the runner.
      - name: Add the Telerik NuGet feed
        shell: pwsh
        env:
          TELERIK_NUGET_USERNAME: ${{ secrets.TELERIK_NUGET_USERNAME }}
          TELERIK_NUGET_PASSWORD: ${{ secrets.TELERIK_NUGET_PASSWORD }}
        run: |
          nuget sources add -Name telerik `
            -Source "https://nuget.telerik.com/v3/index.json" `
            -Username $env:TELERIK_NUGET_USERNAME `
            -Password $env:TELERIK_NUGET_PASSWORD `
            -StorePasswordInClearText -NonInteractive

      # The feed splits the assemblies across several packages, and each ships
      # one folder per target framework, so no single lib folder holds all ten
      # references. Everything is flattened into one staging folder that stands
      # in for a Bin40, preferring the highest .NET Framework 4.x build of any
      # assembly that appears more than once. The list of what must end up there
      # is read out of the project, so it cannot drift from the references.
      - name: Fetch Telerik
        shell: pwsh
        run: |
          nuget install $env:TELERIK_PACKAGE_ID -Version $env:TELERIK_PACKAGE_VERSION `
            -OutputDirectory telerik -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "Restoring $env:TELERIK_PACKAGE_ID $env:TELERIK_PACKAGE_VERSION failed." }

          $bin40 = Join-Path $PWD 'telerik-bin40'
          New-Item -ItemType Directory -Path $bin40 -Force | Out-Null

          function Get-FrameworkRank($path) {
            if ($path -match '\\net(\d{2,3})\\') { return [int]$Matches[1] }
            return 0
          }

          Get-ChildItem -Path telerik -Recurse -Filter *.dll |
            Group-Object Name |
            ForEach-Object {
              $best = $_.Group | Sort-Object { Get-FrameworkRank $_.FullName } -Descending | Select-Object -First 1
              Copy-Item $best.FullName -Destination $bin40 -Force
            }

          $required = Select-String -Path oasis\Oasis_WF.vbproj -Pattern '\$\(TelerikWinFormsDir\)\\([^<]+\.dll)' -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $bin40 $_)) }
          if ($missing) {
            throw "$env:TELERIK_PACKAGE_ID does not provide: $($missing -join ', '). Check the package id and version."
          }

          Write-Host "Staged $($required.Count) referenced assemblies in $bin40"
          "TELERIK_WINFORMS_DIR=$bin40" >> $env:GITHUB_ENV

      # Same key as the build job, so whichever job runs first fills the cache
      # for the other. Only public nuget.org packages live here; Telerik stays
      # in its own folder, outside the cache.
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: packages
          key: nuget-${{ runner.os }}-${{ hashFiles('*/packages.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore packages
        run: nuget restore Oasis_WF.sln -NonInteractive

      - name: Build Oasis_WF
        run: msbuild oasis\Oasis_WF.vbproj /m /p:Configuration=Release /p:Platform=AnyCPU /nologo /v:minimal
